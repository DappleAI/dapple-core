name: CI - DCO

# Every commit in a pull request must carry a Developer Certificate of Origin
# sign-off whose email matches the commit author (`git commit -s`).
# See CONTRIBUTING.md → "Developer Certificate of Origin".
#
# Runs on `pull_request` (never `pull_request_target`): it only reads the
# PR's own commits, so it needs no secrets and no write token.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            author_email="$(git show -s --format='%ae' "$sha")"
            # Bot accounts (dependabot, github-actions) can't sign off.
            case "$author_email" in *"[bot]@users.noreply.github.com") continue ;; esac
            if ! git show -s --format='%B' "$sha" \
                | grep -qiF "Signed-off-by:" ; then
              echo "::error::$(git show -s --format='%h %s' "$sha") has no Signed-off-by line"
              missing=1
            elif ! git show -s --format='%B' "$sha" \
                | grep -i '^Signed-off-by:' | grep -qiF "<${author_email}>"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") is signed off, but not by its author <${author_email}>"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Sign off your commits with: git rebase --signoff ${BASE_SHA} && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
