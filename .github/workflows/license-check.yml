name: CI - License check

# Fails if any dependency in Cargo.lock is under a license that deny.toml does
# not allow (e.g. GPL pulled in by a new crate). Policy and rationale live in
# deny.toml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: license-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned binary + published sha256 (same pattern as secrets-scan.yml).
  # Bump both together.
  CARGO_DENY_VERSION: 0.20.2
  CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o "${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  ${name}.tar.gz" | sha256sum --check --strict
          tar -xzf "${name}.tar.gz" "${name}/cargo-deny"
          install -m 0755 "${name}/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version

      - name: Check dependency licenses
        run: cargo deny --locked check licenses
