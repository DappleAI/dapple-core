name: CI - Secrets scan

# Scans the FULL git history (all branches checked out by fetch-depth: 0) for
# committed secrets using gitleaks + the repo's .gitleaks.toml allowlist.
# Full history rather than just the PR diff: it takes ~10s, and it means a
# secret can't slip in through a commit that a later commit "removes".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only token: this job needs nothing but the checkout.
permissions:
  contents: read

env:
  # Pinned binary + published sha256 instead of gitleaks-action, which needs a
  # paid license key for organization repos and would also have to clear the
  # repo's allowed-actions policy. Bump both together.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        # --redact keeps any real hit out of the public Actions log; the log
        # still names the file, line, commit and rule. Reproduce locally
        # without --redact to see the value.
        run: gitleaks git --log-opts=--all --redact --no-banner --exit-code 1 .
