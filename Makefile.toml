# Configures the default task to run
[tasks.default]
alias = "build-containers"

# Overrides the default build task
[tasks.build]
alias = "build-containers"

[tasks.build-dapple-prompt-api]
workspace = false
script = '''
docker build --rm --target dapple-prompt-api .
docker tag $(docker image ls -q --filter=label=service=dapple-prompt-api) dapple/dapple-prompt-api
'''

[tasks.build-containers]
workspace = false
dependencies = [
    "build-dapple-prompt-api",
]

[tasks.push-containers]
workspace = false
script = '''
echo "No idea what to do here yet."
'''

[tasks.delete-containers]
workspace = false
script = '''
docker image rm $(docker image ls -q --filter=label=service=dapple-prompt-api)
'''
