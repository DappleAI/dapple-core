 name: CI - Rust tests (copy)

# This is a repository copy of the workflow file for reference under assets.
# The active workflow must remain under `.github/workflows/` for GitHub Actions.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          profile: minimal
      - name: Run dapple-data tests (fast)
        run: |
          # Run crate-scoped tests to avoid workspace tests that require services
          cargo test -p dapple-data

  redis-integration:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.DAPPLE_REDIS_HOST != '' }}
    env:
      DAPPLE_REDIS_HOST: ${{ secrets.DAPPLE_REDIS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Run Redis integration tests (ignored)
        run: |
          cargo test -p dapple-data -- --ignored
