apiVersion: v1
kind: Namespace
metadata:
  name: dapple-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{NAME}}
  namespace: dapple-sandbox
  labels: { app: {{NAME}} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{NAME}} }        # must match template labels
  template:
    metadata:
      labels: { app: {{NAME}} }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

      volumes:
        - name: src
          hostPath:
            path: "{{SOURCE_PATH}}"       # your local working copy
            type: Directory
        - name: next-build
          emptyDir: {}                    # .next output (writable, ephemeral)
        - name: node-mods
          emptyDir: {}                    # node_modules cache (writable)
        - name: pnpm-store
          emptyDir: {}                    # pnpm store cache (writable)

      containers:
        - name: {{NAME}}
          image: "node:24.8-bookworm"
          imagePullPolicy: IfNotPresent
          workingDir: /app
          env:
            - { name: NODE_ENV, value: "development" }
            - { name: HOST, value: "0.0.0.0" }
            - { name: HOSTNAME, value: "0.0.0.0" }   # (belt & suspenders)
            - { name: PORT, value: "{{PORT}}" }
            - { name: XDG_CACHE_HOME, value: /pnpm-store/.cache }   # optional, broader cache root
            - { name: PNPM_STORE_DIR, value: /pnpm-store/store }    # pnpm content-addressable store
            - { name: PNPM_HOME,      value: /pnpm-store/pnpm-home } # where pnpm puts shims
            - { name: npm_config_cache, value: /pnpm-store/.npm-cache }
            - { name: PNPM_TMPDIR,      value: /pnpm-store/tmp }
            - { name: NPM_CONFIG_PREFIX, value: /pnpm-store/pnpm-home }   # ensure npm -g respects prefix
            - { name: PATH, value: /pnpm-store/pnpm-home/bin:/usr/local/bin:/usr/bin:/bin }
            - { name: COREPACK_HOME,  value: /pnpm-store/corepack }
            - { name: CHOKIDAR_USEPOLLING, value: "1" }   # cross-FS watch
            - { name: WATCHPACK_POLLING, value: "true" }
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
          ports:
            - { containerPort: {{PORT}}, name: http }
          volumeMounts:
            - { name: src,        mountPath: /app }
            - { name: next-build, mountPath: /app/.next }
            - { name: node-mods,  mountPath: /mods }
            - { name: pnpm-store, mountPath: /pnpm-store }
          command: ["bash","-c"]
          args:
            - |
              set -euo pipefail
              install -d -m 2775 "$COREPACK_HOME" "$PNPM_STORE_DIR" "$PNPM_HOME" "$XDG_CACHE_HOME"

              echo "NPM home: $PNPM_HOME"
              echo "PATH: $PATH"

              echo "setting up prefixes"
              # make npm write to your prefix + cache
              npm config set prefix "$PNPM_HOME"
              echo "setting up cache"
              npm config set cache "$npm_config_cache"

              echo "nmp install"
              # install a pinned pnpm (no /usr/local writes)
              npm install -g pnpm@9.12.0

              echo "pnpm config"
              pnpm config set store-dir "$PNPM_STORE_DIR"
              pnpm config set prefix "$PNPM_HOME"

              echo "pnpm install"
              pnpm install --ignore-scripts --prod=false
              echo "kick off server"
              exec pnpm dev -H 0.0.0.0 -p "{{PORT}}" --experimental-https
---
apiVersion: v1
kind: Service
metadata:
  name: "{{NAME}}"
  namespace: dapple-sandbox
  labels:
    app: "{{NAME}}"
spec:
  type: ClusterIP
  selector:
    app: "{{NAME}}"
  ports:
    - name: http
      port: {{PORT}}
      targetPort: {{PORT}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{NAME}}"
  namespace: dapple-sandbox
  annotations:
    cert-manager.io/cluster-issuer: "local-dev-ca"
spec:
  ingressClassName: public        # or 'nginx' (kubectl get ingressclass)
  tls:
    - hosts: [ "landing-page.kube.dappleai.dev" ]
      secretName: wildcard-kube.dappleai.dev
  rules:
    - host: "landing-page.kube.dappleai.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{NAME}}"
                port:
                  number: {{PORT}}
