apiVersion: v1
kind: Namespace
metadata:
  name: dapple-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{NAME}}
  namespace: dapple-sandbox
  labels:
    app: {{NAME}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{NAME}}
  template:
    metadata:
      labels:
        app: {{NAME}}
    spec:
      containers:
        - name: {{NAME}}
          image: registry.kube.dappleai.dev/{{NAME}}:dapple-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{PORT}}
          env:
            - name: DAPPLE_PROMPT_DATABASE_URL
              value: postgres://dapple:ai@prompt-db:5432/dapple
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /api/health_check, port: {{PORT}} }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health_check, port: {{PORT}} }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{NAME}}
  namespace: dapple-sandbox
spec:
  type: ClusterIP
  selector:
    app: {{NAME}}
  ports:
    - name: http
      port: {{PORT}}
      targetPort: {{PORT}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{NAME}}"
  namespace: dapple-sandbox
  annotations:
    cert-manager.io/cluster-issuer: "local-dev-ca"
spec:
  ingressClassName: public        # or 'nginx' (kubectl get ingressclass)
  tls:
    - hosts: [ "{{NAME}}.kube.dappleai.dev" ]
      secretName: wildcard-kube.dappleai.dev
  rules:
    - host: "{{NAME}}.kube.dappleai.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "{{NAME}}"
                port:
                  number: {{PORT}}
