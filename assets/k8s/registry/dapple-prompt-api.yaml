apiVersion: v1
kind: Namespace
metadata:
  name: dapple-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapple-prompt-api
  namespace: dapple-sandbox
  labels:
    app: dapple-prompt-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dapple-prompt-api
  template:
    metadata:
      labels:
        app: dapple-prompt-api
    spec:
      containers:
        - name: dapple-prompt-api
          image: registry.kube.dappleai.dev/dapple-prompt-api:dapple-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: DAPPLE_PROMPT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: prompt-db
                  key: DAPPLE_PROMPT_DATABASE_URL
            - name: DAPPLE_PROMPT_API_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: dapple-prompt-auth
                  key: DAPPLE_PROMPT_API_SIGNING_KEY
            - name: AUTH_TOKEN_ALLOWED_SIGNERS
              valueFrom:
                secretKeyRef:
                  name: dapple-prompt-auth
                  key: AUTH_TOKEN_ALLOWED_SIGNERS
            - name: DAPPLE_PROMPT_CONDUIT_URL
              value: "http://dapple-prompt-conduit:8081"
            - name: DAPPLE_PROMPT_FLOW_URL
              value: "http://dapple-prompt-flow:8082"
            # Media service + its auth key. Only exercised on the in-process
            # dispatch fallback (when DAPPLE_PROMPT_FLOW_URL is unset and this pod
            # runs `av mix` itself); harmless otherwise. Kept in sync with the
            # flow pod so both executors can reach conduit-oximedia.
            - name: DAPPLE_PROMPT_CONDUIT_MEDIA_URL
              value: "http://conduit-oximedia:8085"
            # Same in-process-fallback rationale for the media gateway (`av
            # render`/`av snapshot`/`twitch`/`vod` commands); without it those
            # dispatches hard-error when this pod executes them itself.
            - name: DAPPLE_MEDIA_GATEWAY_URL
              value: "http://conduit-media-gateway:8086"
            # Same in-process-fallback rationale for SEC EDGAR: the `edgar *`
            # commands need the SEC-mandated declared User-Agent (fair-access
            # policy requires app name + contact) and fail with a shaped "not
            # configured" error without it. Kept in sync with the flow pod so
            # both executors can pull filings.
            - name: DAPPLE_EDGAR_USER_AGENT
              value: "dapple ops@dappleai.com"
            - name: CONDUIT_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: conduit-internal-auth
                  key: internal-key
                  optional: true
            - name: RUST_LOG
              value: "warn,dapple_prompt_api=debug,dapple_prompt_flow=debug,dapple_data=debug"
            # Cap glibc malloc arenas. Default is up to 8 * num_cpus arenas,
            # each pre-reserving ~50 MiB of headroom that is never returned to
            # the OS. On a 4-CPU node that adds ~1.3 GiB of phantom RSS at
            # idle — measured directly via /proc/1/status before/after this
            # was set. Two arenas is enough for the main + tokio worker thread
            # we observed and stays well below any contention threshold for
            # this workload.
            - name: MALLOC_ARENA_MAX
              value: "2"
          resources:
            # Measured 2026-05-07 after wrapping aide::OpenApi in Arc to
            # eliminate per-request deep clones (see dapple-prompt-api commit
            # a4a45745): ~50 MiB resident at idle, ~6 MiB growth across a
            # 10-request burst, sub-10ms latency on /api/health_check from
            # both localhost and via the cluster service.
            #
            # 2Gi/1-core is comfortable headroom
            # (20x current resident, plenty of CPU for 5-call BFF bursts at
            # ~3ms per request) without going so tight that an unrelated
            # regression would page someone immediately. Tighten further if
            # you want — the floor is much lower than these numbers suggest.
            #
            # MALLOC_ARENA_MAX=2 (above) is still set; with the per-request
            # churn gone it matters less, but it's free and keeps the
            # allocator from spreading state across more arenas than the
            # tokio runtime ever uses.
            requests: { cpu: "100m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "2Gi" }
          # Optional but recommended once you have endpoints:
          # readinessProbe:
          #   httpGet: { path: /health, port: 8001 }
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
          # livenessProbe:
          #   httpGet: { path: /health, port: 8001 }
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dapple-prompt-api
  namespace: dapple-sandbox
spec:
  type: ClusterIP
  selector:
    app: dapple-prompt-api
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "dapple-prompt-api"
  namespace: dapple-sandbox
  annotations:
    # Operator asset uploads (e.g. multi-minute WAV "card audio") POST the file
    # through this ingress. Without this, nginx's 1 MB client_max_body_size
    # default returns a 413 HTML page that the UI reports as "Malformed server
    # response". 256m gives headroom for large audio; the backend assets route
    # matches this ceiling (DefaultBodyLimit in route/assets.rs).
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    # Guide ingest (POST/PATCH /api/guides[/{path_id}]/ingest) generates the
    # guide's embeddings SYNCHRONOUSLY in the request path, in a single /embed
    # call to conduit (see handler/guide_embeddings.rs). For a large guide that
    # ONNX pass alone measured 68s (mark-the-bdc, 162 blocks) — past nginx's 60s
    # proxy_read_timeout default, so the client got an opaque 504 while the api
    # was still working and the cancelled handler wrote no embeddings.
    # 300s sits above the api's own 120s embed timeout so the APPLICATION's
    # error surfaces to the client instead of nginx's HTML timeout page.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: public        # or 'nginx' (kubectl get ingressclass)
  tls:
    - hosts: [ "dapple-prompt-api.kube.dappleai.dev" ]
      secretName: wildcard-kube.dappleai.dev  # managed by issuer.yaml Certificate
  rules:
    - host: "dapple-prompt-api.kube.dappleai.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: "dapple-prompt-api"
                port:
                  number: 8001
