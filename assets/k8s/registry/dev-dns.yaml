apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-dns
  namespace: dapple-sandbox
  labels: { app: dev-dns }
spec:
  replicas: 1
  selector:
    matchLabels: { app: dev-dns }
  template:
    metadata:
      labels: { app: dev-dns }
    spec:
      initContainers:
        - name: render-corefile
          image: alpine:3.20
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /etc/coredns
              # Avoid envsubst: Alpine doesn't ship it. Use sed.
              sed "s|\${HOST_IP}|$HOST_IP|g" /tmpl/Corefile.tmpl > /etc/coredns/Corefile
              echo "--- BEGIN Corefile ---"
              cat /etc/coredns/Corefile
              echo "--- END Corefile ---"
          volumeMounts:
            - { name: conf, mountPath: /etc/coredns }
            - { name: tmpl, mountPath: /tmpl }
      containers:
        - name: coredns
          image: coredns/coredns:1.11.1
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - { containerPort: 53, protocol: UDP }
            - { containerPort: 53, protocol: TCP }
          volumeMounts:
            - { name: conf, mountPath: /etc/coredns }
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmpl
          configMap:
            name: dev-dns-template
            items:
              - key: Corefile.tmpl
                path: Corefile.tmpl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-dns-template
  namespace: dapple-sandbox
data:
  Corefile.tmpl: |
    .:53 {
      errors
      log
      health
      ready
      cache 30

      # A for any subdomain of kube.dappleai.dev
      template IN A {
        match ^.+\.kube\.dappleai\.dev\.$
        answer "{{ .Name }} 60 IN A ${HOST_IP}"
      }

      # A for the apex
      template IN A {
        match ^kube\.dappleai\.dev\.$
        answer "{{ .Name }} 60 IN A ${HOST_IP}"
      }

      # Return NODATA (NOERROR + SOA in authority) for types we don't serve
      template IN AAAA {
        match ^(.+\.|)kube\.dappleai\.dev\.$
        rcode NOERROR
        authority "kube.dappleai.dev. 60 IN SOA ns.kube.dappleai.dev. hostmaster.kube.dappleai.dev. 1 7200 3600 1209600 3600"
      }
      template IN HTTPS {
        match ^(.+\.|)kube\.dappleai\.dev\.$
        rcode NOERROR
        authority "kube.dappleai.dev. 60 IN SOA ns.kube.dappleai.dev. hostmaster.kube.dappleai.dev. 1 7200 3600 1209600 3600"
      }
      template IN SVCB {
        match ^(.+\.|)kube\.dappleai\.dev\.$
        rcode NOERROR
        authority "kube.dappleai.dev. 60 IN SOA ns.kube.dappleai.dev. hostmaster.kube.dappleai.dev. 1 7200 3600 1209600 3600"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: dev-dns
  namespace: dapple-sandbox
spec:
  type: NodePort
  selector: { app: dev-dns }
  # TCP deliberately sits on a DIFFERENT nodePort from UDP, and host resolvers
  # only ever name the UDP one (systemd-resolved `DNS=127.0.0.1:30053`, macOS
  # `port 30053`). A resolver names one port and uses it for both transports, so
  # a TCP retry after a truncated UDP answer reaches nothing. That is latent, not
  # live: this zone serves wildcard A records, which never truncate, and macOS
  # has run this way since the beginning.
  #
  # Do NOT "fix" this by giving both entries nodePort 30053. The API server
  # accepts it (verified with --dry-run=server), but `kubectl apply` can never
  # converge it on an EXISTING Service: ServicePort's strategic-merge key is
  # `port`, both entries are `port: 53`, so the patch cannot tell them apart.
  # Tried 2026-07-29 — apply reported "service/dev-dns configured", wrote the new
  # intent into last-applied-configuration, and left the live nodePort at 30054.
  # A manifest that apply silently fails to reconcile is worse than an unused
  # TCP port. Changing it needs delete+recreate, which drops dev DNS mid-setup.
  ports:
    - { name: dns-udp, protocol: UDP, port: 53, nodePort: 30053 }
    - { name: dns-tcp, protocol: TCP, port: 53, nodePort: 30054 }
