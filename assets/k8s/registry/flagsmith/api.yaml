# Flagsmith API - Unified API and Frontend service
# Flagsmith serves both API and UI from the same container on port 8000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagsmith-api
  namespace: flagsmith
  labels:
    app: flagsmith-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagsmith-api
  template:
    metadata:
      labels:
        app: flagsmith-api
    spec:
      containers:
        - name: flagsmith-api
          image: flagsmith/flagsmith:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: flagsmith-config
            - secretRef:
                name: flagsmith-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flagsmith-api
  namespace: flagsmith
spec:
  type: ClusterIP
  selector:
    app: flagsmith-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
