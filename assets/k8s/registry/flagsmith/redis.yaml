# Flagsmith Redis - Task processor queue
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagsmith-redis
  namespace: flagsmith
  labels:
    app: flagsmith-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagsmith-redis
  template:
    metadata:
      labels:
        app: flagsmith-redis
    spec:
      containers:
        - name: flagsmith-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: flagsmith-redis
  namespace: flagsmith
spec:
  type: ClusterIP
  selector:
    app: flagsmith-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
