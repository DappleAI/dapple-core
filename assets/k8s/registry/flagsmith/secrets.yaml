# Flagsmith Secrets
# IMPORTANT: Replace placeholders before applying!
#
# Generate secrets with:
#   openssl rand -hex 32  # For DJANGO_SECRET_KEY (64 chars)

apiVersion: v1
kind: Secret
metadata:
  name: flagsmith-secrets
  namespace: flagsmith
type: Opaque
stringData:
  # Django secret key (64 hex chars)
  # Generate with: openssl rand -hex 32
  DJANGO_SECRET_KEY: "__REPLACE_WITH_64_HEX_CHARS__"

  # Database credentials
  POSTGRES_PASSWORD: "flagsmith"
  DATABASE_URL: "postgresql://flagsmith:flagsmith@flagsmith-postgres:5432/flagsmith"

  # Redis URL (no auth for local deployment)
  REDIS_URL: "redis://flagsmith-redis:6379"
---
# Postgres-specific secret (for the postgres container)
apiVersion: v1
kind: Secret
metadata:
  name: flagsmith-postgres-secret
  namespace: flagsmith
type: Opaque
stringData:
  POSTGRES_PASSWORD: "flagsmith"
