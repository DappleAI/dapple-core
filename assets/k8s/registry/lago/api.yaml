# Lago API - Rails backend service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lago-api
  namespace: lago
  labels:
    app: lago-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lago-api
  template:
    metadata:
      labels:
        app: lago-api
    spec:
      containers:
        - name: lago-api
          image: getlago/api:v1.41.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: lago-config
            - secretRef:
                name: lago-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lago-api
  namespace: lago
spec:
  type: ClusterIP
  selector:
    app: lago-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
