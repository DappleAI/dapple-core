# Lago Front - React UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lago-front
  namespace: lago
  labels:
    app: lago-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lago-front
  template:
    metadata:
      labels:
        app: lago-front
    spec:
      containers:
        - name: lago-front
          image: getlago/front:v1.41.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_URL
              value: "https://lago-api.kube.dappleai.dev"
            - name: APP_ENV
              value: "production"
            - name: LAGO_DISABLE_SIGNUP
              valueFrom:
                configMapKeyRef:
                  name: lago-config
                  key: LAGO_DISABLE_SIGNUP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: lago-front
  namespace: lago
spec:
  type: ClusterIP
  selector:
    app: lago-front
  ports:
    - name: http
      port: 80
      targetPort: 80
