# Lago Redis - Job queue and caching
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lago-redis
  namespace: lago
  labels:
    app: lago-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lago-redis
  template:
    metadata:
      labels:
        app: lago-redis
    spec:
      containers:
        - name: lago-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lago-redis
  namespace: lago
spec:
  type: ClusterIP
  selector:
    app: lago-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
