# Lago Secrets
# IMPORTANT: Replace placeholders before applying!
#
# Generate secrets with:
#   openssl genrsa -out lago-private.pem 2048
#   openssl rand -hex 32  # For SECRET_KEY_BASE (64 chars)
#   openssl rand -base64 32  # For encryption keys

apiVersion: v1
kind: Secret
metadata:
  name: lago-secrets
  namespace: lago
type: Opaque
stringData:
  # Rails secret key (64 hex chars)
  # Generate with: openssl rand -hex 32
  SECRET_KEY_BASE: "__REPLACE_WITH_64_HEX_CHARS__"

  # RSA private key for JWT signing
  # Generate with: openssl genrsa -out lago-private.pem 2048
  # Then paste the contents here (including BEGIN/END lines)
  LAGO_RSA_PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    __REPLACE_WITH_RSA_PRIVATE_KEY__
    -----END RSA PRIVATE KEY-----

  # Encryption keys for sensitive data
  # Generate each with: openssl rand -base64 32
  ENCRYPTION_PRIMARY_KEY: "__REPLACE_WITH_BASE64_KEY__"
  ENCRYPTION_DETERMINISTIC_KEY: "__REPLACE_WITH_BASE64_KEY__"
  ENCRYPTION_KEY_DERIVATION_SALT: "__REPLACE_WITH_BASE64_KEY__"

  # Database credentials
  POSTGRES_PASSWORD: "lago"
  DATABASE_URL: "postgresql://lago:lago@lago-postgres:5432/lago"

  # Redis URL (no auth for local deployment)
  REDIS_URL: "redis://lago-redis:6379"
---
# Postgres-specific secret (for the postgres container)
apiVersion: v1
kind: Secret
metadata:
  name: lago-postgres-secret
  namespace: lago
type: Opaque
stringData:
  POSTGRES_PASSWORD: "lago"
