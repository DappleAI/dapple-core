apiVersion: v1
kind: Namespace
metadata:
  name: dapple-sandbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-docs
  namespace: dapple-sandbox
  labels:
    app: rust-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-docs
  template:
    metadata:
      labels:
        app: rust-docs
    spec:
      containers:
        - name: rust-docs
          image: registry.kube.dappleai.dev/rust-docs:dapple-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health_check
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health_check
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rust-docs
  namespace: dapple-sandbox
spec:
  type: ClusterIP
  selector:
    app: rust-docs
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rust-docs
  namespace: dapple-sandbox
spec:
  ingressClassName: public
  tls:
    - hosts:
        - "rust-docs.kube.dappleai.dev"
      secretName: wildcard-kube.dappleai.dev  # managed by issuer.yaml Certificate
  rules:
    - host: "rust-docs.kube.dappleai.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rust-docs
                port:
                  number: 8080
