[package]
name = "conduit-llm"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
axum = { version = "0.8.4", features = ["http2", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-stream = "0.3"
thiserror = "2.0"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"

# mistral.rs inference engine (GGUF local LLM)
mistralrs = "0.7"

[features]
default = []

[[bin]]
name = "conduit-llm"
path = "src/main.rs"
