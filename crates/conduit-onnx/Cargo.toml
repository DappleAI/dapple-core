[package]
name = "conduit-onnx"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
axum = { version = "0.8.4", features = ["http2", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
tower-http = { version = "0.6", features = ["cors"] }
base64 = "0.22"

# ONNX Runtime inference backend
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "std", "ndarray"] }

# Tokenizers for text preprocessing (shared with ONNX models)
tokenizers = "0.21"

# CPU detection for ONNX Runtime thread configuration
num_cpus = "1.16"

# N-dimensional arrays for tensor operations
ndarray = "0.17"

[features]
default = []

[[bin]]
name = "conduit-onnx"
path = "src/main.rs"
