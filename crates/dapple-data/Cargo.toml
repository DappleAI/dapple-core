[package]
name = "dapple-data"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
sqlx = { workspace = true, features = ["time", "uuid", "rust_decimal"] }
rust_decimal = { version = "1.38", features = ["serde"] }
base64 = "0.22"
time = { version = "0.3.41", features = ["serde"]}
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18.1" , features = ["serde", "v4", "v7"] }
async-trait = "0.1.89"
itertools = "0.14.0"
log = "0.4.27"
schemars = { version = "0.9.0", features = ["uuid1"] }
once_cell = "1.20.0"
pgvector = { workspace = true }
redis = { version = "1.0.1", features = ["aio", "tokio-comp"] }
dotenvy = "0.15"
dapple-hash = { path = "../dapple-hash", features = ["schema"] }
dapple-types = { path = "../dapple-types" }
dapple-fluent = { path = "../dapple-fluent" }

[features]
test-helpers = []
