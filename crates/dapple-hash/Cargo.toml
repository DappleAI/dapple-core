[package]
name = "dapple-hash"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Content-addressable hashing for dapple versioned objects"

[dependencies]
sha1 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Must match dapple-data's schemars version (0.9.x).
# Using a mismatched major version would make ContentHash's JsonSchema
# impl incompatible with dapple-data's derive expectations.
schemars = { version = "0.9", optional = true }

[features]
default = []
schema = ["dep:schemars"]
