[package]
name = "dapple-lago"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde", "v7"] }
thiserror = "2.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
