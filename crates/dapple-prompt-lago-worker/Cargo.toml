[package]
name = "dapple-prompt-lago-worker"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "dapple-prompt-lago-worker"
path = "src/main.rs"

[dependencies]
dapple-data = { path = "../dapple-data" }
dapple-lago = { path = "../dapple-lago" }
sqlx = { workspace = true }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde", "v7"] }
log = "0.4"
env_logger = "0.11"
