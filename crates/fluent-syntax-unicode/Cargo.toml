[package]
name = "fluent-syntax-unicode"
description = """
Fork of fluent-syntax 0.11.1 with a Unicode-aware identifier scanner
so non-ASCII letters (ç, ã, í, …) are accepted in Fluent message and
attribute identifiers. See README.md for the diff against upstream.
"""
version = "0.11.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
# Upstream documentation examples reference `fluent_syntax::…`. We don't rewrite
# them in this fork; they're irrelevant to dapple's use of the crate.
doctest = false

[dependencies]
thiserror = "1"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
# Enables Serialize/Deserialize derives on the AST (upstream fluent-syntax
# parity). Off by default; dapple does not serialize the Fluent AST.
serde = ["dep:serde"]
